openapi: 3.0.3
info:
  title: Dead-Mans API
  version: v1
  description: >
    Canonical transport contract for Dead-Mans: HTTP paths under /api and SignalR hubs
    documented in x-signalr. Regenerate frontend contracts after changes.
servers:
  - url: /api
paths:
  /game:
    get:
      operationId: getCurrentGameBoard
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Active, ready (registration), or latest finished game board
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameBoardSnapshotDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active, ready, or finished game available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /game/team-queue:
    get:
      operationId: getCurrentGameTeamQueue
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Confirmed team queue and server-side summary for the current active or ready game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameTeamQueueResultDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /game/active-team:
    put:
      operationId: setActiveGameTeam
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActiveGameTeamRequestDto'
      responses:
        '204':
          description: Active team selected or cleared
        '400':
          description: Invalid team id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing moderator/admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active game or team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Team cannot become active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /game/teams/{teamId}/played-state:
    put:
      operationId: setGameTeamPlayedState
      security:
        - cookieAuth: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGameTeamPlayedStateRequestDto'
      responses:
        '204':
          description: Team played state updated
        '400':
          description: Invalid team id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing moderator/admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Active game or team not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Team played state cannot be updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /game/modifiers/catalog:
    get:
      operationId: getGameModifierCatalog
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Global catalog of supported game modifiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameModifierDefinitionDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/modifiers/history:
    get:
      operationId: getModifierHistory
      security:
        - cookieAuth: []
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, archived, all], default: all } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Keyset-paginated current modifier summaries, including archived definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifierHistoryPageDto'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /game/modifiers/{modifierId}/versions:
    get:
      operationId: getModifierVersions
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: modifierId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Keyset-paginated immutable revision timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModifierVersionPageDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /game/modifiers/{modifierId}/versions/{revision}:
    get:
      operationId: getModifierVersion
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: modifierId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: revision, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Full immutable modifier revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModifierVersionDetailDto' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /game/modifiers/{modifierId}/versions/{revision}/games:
    get:
      operationId: getModifierVersionGames
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: modifierId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: revision, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Games pinned to this revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModifierVersionGamesPageDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /game/modifiers/state:
    get:
      operationId: getGameModifierState
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current game modifier state for the authenticated player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameModifierStateDto'
        '204':
          description: No active game
        '400':
          description: User id could not be resolved from auth cookie claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/modifiers/admin/players:
    get:
      operationId: getAdminGameModifierPlayers
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Active players with quiz-point balances and server-side summary for the current game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameModifierAdminPlayersResultDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/modifiers/admin/state/{userId}:
    get:
      operationId: getAdminGameModifierState
      security:
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current game modifier state for the selected player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameModifierStateDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active game or selected player not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/modifiers/admin/activations:
    get:
      operationId: getAdminActiveGameModifierActivations
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All active modifier activations in the current game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameModifierActivationDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/modifiers:
    post:
      operationId: createGameModifier
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameModifierRequestDto'
      responses:
        '201':
          description: Modifier definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameModifierDefinitionDto'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Compatibility change touches a modifier pinned by an active game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/modifiers/preview:
    post:
      operationId: previewGameModifier
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameModifierRequestDto'
      responses:
        '200':
          description: Normalized modifier card and authoritative calculation example
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameModifierDraftPreviewDto'
        '400':
          description: Invalid modifier draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Modifier formula cannot produce an example
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/modifiers/{modifierId}:
    put:
      operationId: updateGameModifier
      security:
        - cookieAuth: []
      parameters:
        - name: modifierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameModifierRequestDto'
      responses:
        '200':
          description: Modifier definition updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameModifierDefinitionDto'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Modifier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Modifier content is locked by the active game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteGameModifier
      security:
        - cookieAuth: []
      parameters:
        - name: modifierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: expectedRevision
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Modifier definition archived (soft-deleted)
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Modifier not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Modifier content is locked by the active game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/modifiers/{modifierId}/activate:
    post:
      operationId: activateGameModifier
      security:
        - cookieAuth: []
      parameters:
        - name: modifierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Modifier activated for the current active game
        '400':
          description: User id could not be resolved from auth cookie claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Modifier not found or no active game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Modifier not enabled, emergency-disabled, blocked by limits/conflicts/order window, or player lacks quiz points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/modifiers/{modifierId}/emergency-disable:
    post:
      operationId: emergencyDisableGameModifier
      security:
        - cookieAuth: []
      parameters:
        - name: modifierId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyDisableGameModifierRequestDto'
      responses:
        '204':
          description: New activations disabled; repeated calls are idempotent
        '400':
          description: Invalid reason or unresolved actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Modifier is not enabled in the active game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /game/modifiers/admin/activate:
    post:
      operationId: adminActivateGameModifier
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminActivateGameModifierRequestDto'
      responses:
        '204':
          description: Modifier activated for the selected player
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active game, modifier not found, or selected player not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Modifier not enabled, blocked by limits/conflicts/order window, or player lacks quiz points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /game/modifiers/activations/{activationId}/self-cancel:
    post:
      operationId: selfCancelGameModifierActivation
      security:
        - cookieAuth: []
      parameters:
        - name: activationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelGameModifierActivationRequestDto'
      responses:
        '204':
          description: Owned modifier activation cancelled once and quiz points fully refunded
        '400':
          description: Invalid command payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Activation is not owned by the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active game or modifier activation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Round stage or expected version does not allow cancellation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /game/modifiers/admin/activations/{activationId}/cancel:
    post:
      operationId: adminCancelGameModifierActivation
      security:
        - cookieAuth: []
      parameters:
        - name: activationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelGameModifierActivationRequestDto'
      responses:
        '204':
          description: Modifier activation cancelled once and quiz points fully refunded
        '400':
          description: Invalid command payload or missing audit reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active game or modifier activation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Round stage or expected version does not allow cancellation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /game/notifications:
    get:
      operationId: getGameNotifications
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Unread game notifications for the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameUserNotificationDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/notifications/read:
    post:
      operationId: markGameNotificationsRead
      security:
        - cookieAuth: []
      responses:
        '204':
          description: All unread game notifications were marked as read
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/questions/catalog:
    get:
      operationId: getGameQuestionCatalog
      security:
        - cookieAuth: []
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: includeDisabled
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Question catalog for global category management
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameQuestionCatalogItemDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/questions/categories:
    get:
      operationId: getGameQuestionCategories
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Global question categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameQuestionCategoryItemDto'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createGameQuestionCategory
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameQuestionCategoryRequestDto'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameQuestionCategoryItemDto'
        '200':
          description: Category already existed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameQuestionCategoryItemDto'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /game/questions/import-template:
    get:
      operationId: downloadGameQuestionImportTemplate
      security:
        - cookieAuth: []
      parameters:
        - name: locale
          in: query
          required: false
          schema:
            type: string
          description: >
            Optional UI locale hint for template comments. `ru*` returns Russian comments;
            all other values return English comments.
      responses:
        '200':
          description: JSONC template for bulk question import
