      type: object
      required: [gameId, roundId, status, occurredAtUtc]
      description: SignalR payload for game-board hub event roundStateChanged.
      properties:
        gameId:
          type: string
        roundId:
          type: string
          format: uuid
        status:
          type: string
        occurredAtUtc:
          type: string
          format: date-time
