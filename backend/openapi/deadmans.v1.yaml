components:
  responses:
    InternalServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dm_auth
  schemas:
    GameBoardCellMediaDto:
      type: object
      required: [url]
      properties:
        url:
          type: string
    GameBoardCellDto:
      type: object
      required: [id, row, col, cellType, cost, state, media]
      properties:
        id:
          type: string
        row:
          type: integer
        col:
          type: integer
        cellType:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        cost:
          type: integer
        state:
          type: string
          enum: [closed, open]
        media:
          type: array
          items:
            $ref: '#/components/schemas/GameBoardCellMediaDto'
    CreateGameSetupRequestDto:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    UpdateGameSetupCellDto:
      type: object
      required: [row, col, cost]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Existing cell id. Omit for newly added board positions.
        row:
          type: integer
          minimum: 0
        col:
          type: integer
          minimum: 0
        title:
          type: string
          nullable: true
          maxLength: 200
        cost:
          type: integer
          minimum: 0
    UpdateGameSetupRequestDto:
      type: object
      required: [expectedVersion, title, rowLabels, colLabels, cells, enabledModifierIds]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Board version the client last loaded; save fails with 409 when the draft changed elsewhere
        title:
          type: string
          minLength: 1
          maxLength: 200
        rowLabels:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 100
        colLabels:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 100
        cells:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UpdateGameSetupCellDto'
        enabledModifierIds:
          type: array
          items:
            type: string
            format: uuid
        enabledQuestionIds:
