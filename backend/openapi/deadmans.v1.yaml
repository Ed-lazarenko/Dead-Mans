components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dm_auth
  schemas:
    GameBoardCellMediaDto:
      type: object
      required: [url]
      properties:
        url:
          type: string
    GameBoardCellDto:
      type: object
      required: [id, row, col, cellType, cost, state, media]
      properties:
        id:
          type: string
        row:
          type: integer
        col:
          type: integer
        cellType:
          type: string
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        cost:
          type: integer
        state:
          type: string
          enum: [closed, open, cancelled]
        media:
          type: array
          items:
            $ref: '#/components/schemas/GameBoardCellMediaDto'
    CreateGameSetupRequestDto:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    UpdateGameSetupCellDto:
      type: object
      required: [row, col, cost]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Existing cell id. Omit for newly added board positions.
        row:
          type: integer
          minimum: 0
        col:
          type: integer
          minimum: 0
        title:
          type: string
          nullable: true
          maxLength: 200
        cost:
          type: integer
          minimum: 0
    UpdateGameSetupRequestDto:
      type: object
      required: [expectedVersion, title, rowLabels, colLabels, cells, enabledModifierIds]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
          description: Board version the client last loaded; save fails with 409 when the draft changed elsewhere
        title:
          type: string
          minLength: 1
          maxLength: 200
        rowLabels:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 100
        colLabels:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 100
        cells:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UpdateGameSetupCellDto'
        enabledModifierIds:
          type: array
          items:
            type: string
            format: uuid
        enabledQuestionIds:
          type: array
          items:
            type: string
            format: uuid
    GameSetupSnapshotDto:
      type: object
      required:
        [gameId, title, status, version, rows, cols, rowLabels, colLabels, cells, enabledModifierIds, enabledQuestionIds]
      properties:
        gameId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft]
        version:
          type: integer
        rows:
          type: integer
        cols:
          type: integer
        rowLabels:
          type: array
          items:
            type: string
        colLabels:
          type: array
          items:
            type: string
        cells:
          type: array
          items:
            $ref: '#/components/schemas/GameBoardCellDto'
        enabledModifierIds:
          type: array
          items:
            type: string
            format: uuid
        enabledQuestionIds:
          type: array
          items:
            type: string
            format: uuid
    GameLifecycleStateDto:
      type: object
      required: [gameId, status]
      properties:
        gameId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ready, active, finished]
    GameFinishIssueDto:
      type: object
      required: [code, count]
      properties:
        code:
          type: string
        count:
          type: integer
          minimum: 1
    GameFinishTeamResultDto:
      type: object
      required:
        - teamId
        - teamSlotIndex
        - participantNames
        - roundsPlayed
        - penaltyTotal
        - totalScore
        - totalBonusDelta
        - totalKills
        - totalBounties
      properties:
        teamId:
          type: string
          format: uuid
        teamName:
          type: string
          nullable: true
        teamSlotIndex:
          type: integer
        participantNames:
          type: array
          items:
            type: string
        roundsPlayed:
          type: integer
          minimum: 0
        bestScore:
          type: integer
          nullable: true
        penaltyTotal:
          type: integer
        finalScore:
          type: integer
          nullable: true
        totalScore:
          type: integer
        totalBonusDelta:
          type: integer
        totalKills:
          type: integer
        totalBounties:
          type: integer
        placement:
          type: integer
          nullable: true
        lastFinishedAtUtc:
          type: string
          format: date-time
          nullable: true
    GameFinishSummaryDto:
      type: object
      required:
        - gameId
        - gameTitle
        - gameStatus
        - boardVersion
        - calculationVersion
        - completedRoundCount
        - cancelledRoundCount
        - totalKills
        - totalBounties
        - quizTotalPoints
        - pendingQuizQuestionCount
        - skippedQuizQuestionCount
        - teams
      properties:
        gameId:
          type: string
          format: uuid
        gameTitle:
          type: string
        gameStatus:
          type: string
          enum: [active, finished]
        boardVersion:
          type: integer
          minimum: 1
        finishedAtUtc:
          type: string
          format: date-time
          nullable: true
        finishedByUserId:
          type: string
          format: uuid
          nullable: true
        finishedByDisplayName:
          type: string
          nullable: true
        publicNote:
          type: string
          nullable: true
          maxLength: 2000
        calculationVersion:
          type: integer
          minimum: 1
        completedRoundCount:
          type: integer
        cancelledRoundCount:
          type: integer
        totalKills:
          type: integer
        totalBounties:
          type: integer
        quizTotalPoints:
          type: integer
        pendingQuizQuestionCount:
          type: integer
        skippedQuizQuestionCount:
          type: integer
        teams:
          type: array
          items:
            $ref: '#/components/schemas/GameFinishTeamResultDto'
    GameFinishPreviewDto:
      type: object
      required: [summary, canFinish, blockers, warnings]
      properties:
        summary:
          $ref: '#/components/schemas/GameFinishSummaryDto'
        canFinish:
          type: boolean
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/GameFinishIssueDto'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/GameFinishIssueDto'
    FinishGameRequestDto:
      type: object
      required: [expectedBoardVersion, requestId, acknowledgedWarningCodes]
      properties:
        expectedBoardVersion:
          type: integer
          minimum: 1
        requestId:
          type: string
          format: uuid
        acknowledgedWarningCodes:
          type: array
          uniqueItems: true
          items:
            type: string
        note:
          type: string
          nullable: true
          maxLength: 2000
    FinishGameResponseDto:
      type: object
      required: [summary, alreadyFinished]
      properties:
        summary:
          $ref: '#/components/schemas/GameFinishSummaryDto'
        alreadyFinished:
          type: boolean
    RegistrationPlayerDto:
      type: object
      required: [userId, login, displayName]
      properties:
        userId:
          type: string
          format: uuid
        login:
          type: string
        displayName:
          type: string
    RegistrationTeamMemberDto:
      type: object
      required: [player, joinedAtUtc]
      properties:
        player:
          $ref: '#/components/schemas/RegistrationPlayerDto'
        joinedAtUtc:
          type: string
          format: date-time
    RegistrationTeamPendingInvitationDto:
      type: object
      required: [invitationId, player, createdAtUtc]
      properties:
        invitationId:
          type: string
          format: uuid
        player:
          $ref: '#/components/schemas/RegistrationPlayerDto'
        createdAtUtc:
          type: string
          format: date-time
    RegistrationTeamDto:
      type: object
      required:
        - teamId
        - teamSlotIndex
        - teamSlotType
        - recruitmentOpen
        - status
        - isPlayed
        - isActiveInGame
        - members
        - pendingInvitations
      properties:
        teamId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 48
          nullable: true
        teamSlotIndex:
          type: integer
        teamSlotType:
          type: string
          enum: [public, reserved]
        reservedLabel:
          type: string
          nullable: true
        recruitmentOpen:
          type: boolean
        status:
          type: string
        isPlayed:
          type: boolean
        disbandRequestedAtUtc:
          type: string
          format: date-time
          nullable: true
        disbandRequestedByUserId:
          type: string
          format: uuid
          nullable: true
        disbandRequestedByDisplayName:
          type: string
          nullable: true
        isActiveInGame:
          type: boolean
        members:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationTeamMemberDto'
        pendingInvitations:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationTeamPendingInvitationDto'
    RegistrationTeamSlotDto:
      type: object
      required:
        - teamSlotId
        - teamSlotIndex
        - teamSlotType
        - isAvailableForNewTeam
      properties:
        teamSlotId:
          type: string
          format: uuid
        teamSlotIndex:
          type: integer
        teamSlotType:
          type: string
          enum: [public, reserved]
        reservedLabel:
          type: string
          nullable: true
        isAvailableForNewTeam:
          type: boolean
        teamId:
          type: string
          format: uuid
          nullable: true
        teamStatus:
          type: string
          nullable: true
    RegistrationInvitationDto:
      type: object
      required: [invitationId, teamSlotId, teamSlotIndex, status, createdAtUtc]
      properties:
        invitationId:
          type: string
          format: uuid
        teamSlotId:
          type: string
          format: uuid
        teamSlotIndex:
          type: integer
        teamId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
        createdAtUtc:
          type: string
          format: date-time
        invitedByDisplayName:
          type: string
          nullable: true
        invitedUserDisplayName:
          type: string
          nullable: true
