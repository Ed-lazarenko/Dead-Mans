      type: object
      description: >
        SignalR payload for game-setup hub event draftChanged. The server sends no JSON body;
        clients refetch GET /api/game/setup after receiving the event.
      additionalProperties: false
x-signalr:
  version: v1
  description: >
    SignalR hubs run on the backend origin (not under /api). Negotiate with cookie auth
    (same session as HTTP). Event names and hub paths are stable contract surface.
  hubs:
    gameBoard:
      path: /hubs/game-board
      security:
        - cookieAuth: []
      authorization:
        summary: Any authenticated panel user.
      serverEvents:
        cellOpened:
          summary: A board cell was opened by an admin.
          payload:
            $ref: '#/components/schemas/GameCellOpenedEventDto'
        modifierActivated:
          summary: A game modifier was activated by a moderator or admin.
          payload:
            $ref: '#/components/schemas/GameModifierActivatedEventDto'
        modifierActivationCancelled:
          summary: A game modifier activation was cancelled by an admin.
          payload:
            $ref: '#/components/schemas/GameModifierActivationCancelledEventDto'
        modifierAvailabilityChanged:
          summary: Availability of a game modifier changed and clients must resync modifier state.
          payload:
            $ref: '#/components/schemas/GameModifierAvailabilityChangedEventDto'
        modifierCatalogChanged:
          summary: Modifier revisions or archive state changed; clients invalidate catalog and histories.
          payload:
            $ref: '#/components/schemas/ModifierCatalogChangedEventDto'
        roundStateChanged:
          summary: Round state changed for the active game round.
          payload:
            $ref: '#/components/schemas/GameRoundStateChangedEventDto'
        quizStateChanged:
          summary: Quiz history or quiz points changed for the current active game.
          payload:
            $ref: '#/components/schemas/GameQuizStateChangedEventDto'
        userNotificationCreated:
          summary: A user-specific game notification was created for the connected player.
          payload:
            $ref: '#/components/schemas/GameUserNotificationCreatedEventDto'
        gameLifecycleChanged:
          summary: The active game was finalized and clients must resync board and history state.
          payload:
            $ref: '#/components/schemas/GameLifecycleChangedEventDto'
      clientEvents: {}
    gameSetup:
      path: /hubs/game-setup
      security:
        - cookieAuth: []
      authorization:
        summary: Admin role required (enforced in GameSetupHub).
      serverEvents:
        draftChanged:
          summary: Draft setup changed; clients resync from GET /api/game/setup.
          payload:
            $ref: '#/components/schemas/GameSetupDraftChangedEventDto'
      clientEvents: {}
