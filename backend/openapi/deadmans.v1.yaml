          type: string
        version:
          type: integer
        activation:
          $ref: '#/components/schemas/GameModifierActivationDto'
    GameModifierActivationCancelledEventDto:
      type: object
      required: [gameId, version, activationId]
      description: SignalR payload for game-board hub event modifierActivationCancelled.
      properties:
        gameId:
          type: string
        version:
          type: integer
        activationId:
          type: string
          format: uuid
